name: Acquire and validate OFET external data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acquire-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas openpyxl requests scipy scikit-learn catboost

      - name: Download, verify, and convert OFET-db workbooks
        run: python scripts/acquire_ofetdb.py

      - name: Run locked hidden-family and hidden-dataset validation
        run: python scripts/run_hidden_family_dataset_validation.py | tee hidden_validation.log

      - name: Commit verified data and validation outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ofet_raw ofet_hidden_validation hidden_validation.log
          if git diff --cached --quiet; then
            echo "No output changes"
            exit 0
          fi
          git commit -m "Add hidden family and dataset validation results"
          git push
