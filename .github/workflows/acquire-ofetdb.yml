name: Validate repeat-unit structure-aware OFET model

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - scripts/**
      - tests/**
      - trigger-ofet-acquisition.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  structure-aware-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas openpyxl requests scipy scikit-learn catboost rdkit pytest

      - name: Restore source and tests
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          for src, dst in [
              ('scripts/run_structure_aware_validation.py.gz.b64', 'scripts/run_structure_aware_validation.py'),
              ('tests/test_structure_aware_model.py.gz.b64', 'tests/test_structure_aware_model.py'),
          ]:
              Path(dst).parent.mkdir(parents=True, exist_ok=True)
              Path(dst).write_bytes(gzip.decompress(base64.b64decode(Path(src).read_text().strip())))
          PY

      - name: Acquire verified OFET-db source
        run: python scripts/acquire_ofetdb.py

      - name: Run tests
        env:
          PYTHONPATH: scripts
        run: |
          python -m py_compile scripts/run_structure_aware_validation.py tests/test_structure_aware_model.py
          pytest -q tests/test_structure_aware_model.py

      - name: Run locked structure-aware family holdout
        run: python scripts/run_structure_aware_validation.py | tee structure_validation.log

      - name: Commit results to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ofet_raw ofet_structure_validation structure_validation.log
          if git diff --cached --quiet; then
            echo "No output changes"
            exit 0
          fi
          git commit -m "Add repeat-unit structure-aware validation results"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
