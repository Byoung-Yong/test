name: Acquire verified OFET-db data

on:
  push:
    branches:
      - chatgpt/ofet-raw-acquisition-20260726
    paths:
      - scripts/acquire_ofetdb.py
      - .github/workflows/acquire-ofetdb.yml
      - trigger-ofet-acquisition.txt

permissions:
  contents: write

jobs:
  acquire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out acquisition branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/ofet-raw-acquisition-20260726
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas openpyxl requests

      - name: Download, verify, and convert OFET-db workbooks
        run: python scripts/acquire_ofetdb.py

      - name: Commit verified outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ofet_raw
          if git diff --cached --quiet; then
            echo "No output changes"
            exit 0
          fi
          git commit -m "Add verified OFET-db raw data"
          git push origin HEAD:chatgpt/ofet-raw-acquisition-20260726
