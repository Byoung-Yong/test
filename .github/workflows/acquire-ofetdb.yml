name: Acquire and validate OFET external data

on:
  push:
    branches:
      - chatgpt/ofet-raw-acquisition-20260726
    paths:
      - scripts/**
      - tests/**
      - .github/workflows/acquire-ofetdb.yml
      - trigger-ofet-acquisition.txt

permissions:
  contents: write

jobs:
  acquire-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out acquisition branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/ofet-raw-acquisition-20260726
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas openpyxl requests scipy scikit-learn catboost rdkit pytest

      - name: Restore structure-aware source and tests
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          pairs = [
              (Path('scripts/run_structure_aware_validation.py.gz.b64'), Path('scripts/run_structure_aware_validation.py')),
              (Path('tests/test_structure_aware_model.py.gz.b64'), Path('tests/test_structure_aware_model.py')),
          ]
          for src, dst in pairs:
              dst.parent.mkdir(parents=True, exist_ok=True)
              dst.write_bytes(gzip.decompress(base64.b64decode(src.read_text().strip())))
          PY

      - name: Download, verify, and convert OFET-db workbooks
        run: python scripts/acquire_ofetdb.py

      - name: Verify structure-aware implementation
        env:
          PYTHONPATH: scripts
        run: |
          python -m py_compile scripts/run_structure_aware_validation.py tests/test_structure_aware_model.py
          pytest -q tests/test_structure_aware_model.py

      - name: Run validation and preserve diagnostic output
        shell: bash
        run: |
          set +e
          python scripts/run_hidden_validation_fixed.py > hidden_validation.log 2>&1
          validation_code=$?
          if [ "$validation_code" -eq 0 ]; then
            python scripts/audit_dataset_independence.py >> hidden_validation.log 2>&1
            audit_code=$?
            python scripts/run_709_external_dataset_test_fixed.py >> hidden_validation.log 2>&1
            external709_code=$?
            if [ "$external709_code" -eq 0 ]; then
              python scripts/dump_709_encoder_categories.py >> hidden_validation.log 2>&1
              category_dump_code=$?
            else
              category_dump_code=99
            fi
          else
            audit_code=99
            external709_code=99
            category_dump_code=99
          fi

          python scripts/run_structure_aware_validation.py > structure_validation.log 2>&1
          structure_code=$?

          echo "validation=$validation_code" > hidden_validation.exitcode
          echo "audit=$audit_code" >> hidden_validation.exitcode
          echo "external709=$external709_code" >> hidden_validation.exitcode
          echo "category_dump=$category_dump_code" >> hidden_validation.exitcode
          echo "structure=$structure_code" >> hidden_validation.exitcode
          cat structure_validation.log
          exit 0

      - name: Commit data, results, and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ofet_raw hidden_validation.log hidden_validation.exitcode structure_validation.log
          if [ -d ofet_hidden_validation ]; then git add ofet_hidden_validation; fi
          if [ -d ofet_structure_validation ]; then git add ofet_structure_validation; fi
          if git diff --cached --quiet; then
            echo "No output changes"
            exit 0
          fi
          git commit -m "Add repeat-unit structure-aware validation"
          git push origin HEAD:chatgpt/ofet-raw-acquisition-20260726
