name: Acquire and validate OFET external data

on:
  push:
    branches:
      - chatgpt/ofet-raw-acquisition-20260726
    paths:
      - scripts/**
      - .github/workflows/acquire-ofetdb.yml
      - trigger-ofet-acquisition.txt

permissions:
  contents: write

jobs:
  acquire-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out acquisition branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/ofet-raw-acquisition-20260726
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas openpyxl requests scipy scikit-learn catboost

      - name: Download, verify, and convert OFET-db workbooks
        run: python scripts/acquire_ofetdb.py

      - name: Run validation and preserve diagnostic output
        shell: bash
        run: |
          set +e
          python scripts/run_hidden_validation_fixed.py > hidden_validation.log 2>&1
          validation_code=$?
          if [ "$validation_code" -eq 0 ]; then
            python scripts/audit_dataset_independence.py >> hidden_validation.log 2>&1
            audit_code=$?
            python scripts/run_709_external_dataset_test.py >> hidden_validation.log 2>&1
            external709_code=$?
          else
            audit_code=99
            external709_code=99
          fi
          echo "validation=$validation_code" > hidden_validation.exitcode
          echo "audit=$audit_code" >> hidden_validation.exitcode
          echo "external709=$external709_code" >> hidden_validation.exitcode
          cat hidden_validation.log
          exit 0

      - name: Commit data, results, and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ofet_raw hidden_validation.log hidden_validation.exitcode
          if [ -d ofet_hidden_validation ]; then git add ofet_hidden_validation; fi
          if git diff --cached --quiet; then
            echo "No output changes"
            exit 0
          fi
          git commit -m "Update hidden validation, independence audit, and 709 external test"
          git push origin HEAD:chatgpt/ofet-raw-acquisition-20260726
